android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
kapt.use.worker.api=false
compose.ios.resources.sync=false
# NOTE: pas de org.gradle.java.home ici — chemin machine-spécifique interdit :
# la CI (setup-java) et chaque dev fournissent leur JDK via JAVA_HOME.
# Ressources Compose iOS désactivées : le module n'a aucun `composeResources`
# (ni usage de `Res.*`) ; la synchro exigerait l'env Xcode complet
# (PLATFORM_NAME/ARCHS + sandboxing) et casse le link depuis un pbxproj
# minimal. À retirer le jour où des ressources Compose (fonts/images)
# seront embarquées (voir design, risque ressources iOS).